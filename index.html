<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcar um Date</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(233, 30, 99, 0.15);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #e91e63;
            font-size: 28px;
        }

        .progress {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #e91e63;
            transition: width 0.3s ease;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .question-title {
            color: #e91e63;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 14px 16px;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            color: #333;
            font-size: 14px;
        }

        .option:hover {
            border-color: #e91e63;
            background: #fff5f8;
        }

        .option.selected {
            background: #e91e63;
            color: white;
            border-color: #e91e63;
        }

        /* Proposta inicial (sim/não) */
        .proposal-box {
            position: relative;
            height: 220px;
            background: #fff5f8;
            border-radius: 12px;
            border: 2px dashed #f8bbd0;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .btn-yes, .btn-no {
            position: absolute;
            top: 50%;
            flex: none;
            width: auto;
            white-space: nowrap;
            padding: 14px 28px;
            font-size: 16px;
        }

        .btn-yes {
            left: 30%;
            transform: translate(-50%, -50%);
            background: #e91e63;
            color: white;
        }

        .btn-yes:hover {
            background: #c2185b;
        }

        .btn-no {
            left: 70%;
            transform: translate(-50%, -50%);
            background: white;
            color: #e91e63;
            border: 2px solid #e91e63;
        }

        /* Calendário */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-header span {
            color: #e91e63;
            font-weight: 600;
            font-size: 15px;
        }

        .cal-nav {
            flex: none;
            width: auto;
            background: none;
            color: #e91e63;
            font-size: 20px;
            line-height: 1;
            padding: 6px 12px;
        }

        .cal-nav:hover:not(:disabled) {
            background: #fce4ec;
        }

        .cal-nav:disabled {
            color: #ddd;
            cursor: not-allowed;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .cal-day:hover:not(.disabled):not(.empty) {
            border-color: #e91e63;
            background: #fff5f8;
        }

        .cal-day.selected {
            background: #e91e63;
            color: white;
        }

        .cal-day.disabled,
        .cal-day.empty {
            cursor: default;
        }

        .cal-day.disabled {
            color: #ddd;
        }

        /* Horário estilo relógio */
        .time-picker {
            display: flex;
            justify-content: center;
            margin: 10px 0 20px;
        }

        .time-input {
            font-family: 'Courier New', monospace;
            font-size: 40px;
            font-weight: 700;
            color: #e91e63;
            text-align: center;
            letter-spacing: 2px;
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            padding: 16px 20px;
            background: #fff5f8;
            width: 100%;
            max-width: 220px;
        }

        .time-input:focus {
            outline: none;
            border-color: #e91e63;
        }

        .suggestion-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s ease;
            margin-top: 16px;
        }

        .suggestion-box:focus {
            outline: none;
            border-color: #e91e63;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .btn-next {
            background: #e91e63;
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            background: #c2185b;
            transform: translateY(-2px);
        }

        .btn-next:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-prev {
            background: #f5f5f5;
            color: #333;
        }

        .btn-prev:hover {
            background: #e0e0e0;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .success-message.active {
            display: block;
        }

        .success-message h2 {
            color: #e91e63;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .success-message p {
            color: #666;
            font-size: 14px;
        }

        .loading {
            display: none;
        }

        .loading.active {
            display: block;
            text-align: center;
            color: #e91e63;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💕 Vamos Marcar um Date?</h1>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Pergunta 0: Proposta -->
        <div class="question-container active" id="question0">
            <h2 class="question-title" style="text-align:center;">Quer sair comigo? 💕</h2>
            <div class="proposal-box" id="proposalBox">
                <button type="button" class="btn-yes" id="btnSim">Sim</button>
                <button type="button" class="btn-no" id="btnNao">Não</button>
            </div>
        </div>

        <!-- Pergunta 1: Dia -->
        <div class="question-container" id="question1">
            <h2 class="question-title">Qual dia você prefere?</h2>
            <div class="calendar">
                <div class="calendar-header">
                    <button type="button" class="cal-nav" id="prevMonth" aria-label="Mês anterior">‹</button>
                    <span id="calendarMonthYear"></span>
                    <button type="button" class="cal-nav" id="nextMonth" aria-label="Próximo mês">›</button>
                </div>
                <div class="calendar-weekdays">
                    <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                </div>
                <div class="calendar-days" id="calendarDays"></div>
            </div>
            <div class="button-group">
                <button class="btn-next" id="btnNext1" disabled>Próximo</button>
            </div>
        </div>

        <!-- Pergunta 2: Hora -->
        <div class="question-container" id="question2">
            <h2 class="question-title">Que horas você prefere?</h2>
            <div class="time-picker">
                <input type="time" id="horaInput" class="time-input">
            </div>
            <div class="button-group">
                <button class="btn-prev" id="btnPrev2">Voltar</button>
                <button class="btn-next" id="btnNext2" disabled>Próximo</button>
            </div>
        </div>

        <!-- Pergunta 3: Lugar -->
        <div class="question-container" id="question3">
            <h2 class="question-title">Qual lugar você prefere?</h2>
            <div class="options" id="lugarOptions"></div>
            <input type="text" class="suggestion-box" id="sugestao" placeholder="Alguma sugestão?">
            <div class="button-group">
                <button class="btn-prev" id="btnPrev3">Voltar</button>
                <button class="btn-next" id="btnSubmit" disabled>Enviar</button>
            </div>
        </div>

        <!-- Mensagem de sucesso -->
        <div class="success-message" id="successMessage">
            <h2>✓ Enviado com sucesso!</h2>
            <p>Suas preferências foram registradas.</p>
        </div>

        <div class="loading" id="loading">
            <p>Enviando...</p>
        </div>
    </div>

    <script>
        // Inicializar EmailJS
        try {
            emailjs.init('0eH6oUZImnA8bZFE6');
        } catch (error) {
            console.error('Erro ao inicializar EmailJS:', error);
        }

        let currentQuestion = 0;
        const totalQuestions = 4;

        // Elementos
        const containers = {
            0: document.getElementById('question0'),
            1: document.getElementById('question1'),
            2: document.getElementById('question2'),
            3: document.getElementById('question3')
        };

        const progressBar = document.getElementById('progressBar');
        const successMessage = document.getElementById('successMessage');
        const loading = document.getElementById('loading');

        function updateProgress() {
            const progress = (currentQuestion / totalQuestions) * 100;
            progressBar.style.width = progress + '%';
        }

        function goToQuestion(questionNum) {
            Object.values(containers).forEach(container => {
                container.classList.remove('active');
            });
            containers[questionNum].classList.add('active');
            currentQuestion = questionNum;
            updateProgress();
        }

        // ---- Pergunta 0: proposta (sim foge do "não") ----
        const btnNao = document.getElementById('btnNao');
        const proposalBox = document.getElementById('proposalBox');

        function moveBtnNao() {
            const boxRect = proposalBox.getBoundingClientRect();
            const btnWidth = btnNao.offsetWidth;
            const btnHeight = btnNao.offsetHeight;
            const maxLeft = Math.max(boxRect.width - btnWidth - 12, 12);
            const maxTop = Math.max(boxRect.height - btnHeight - 12, 12);
            const newLeft = 12 + Math.random() * (maxLeft - 12);
            const newTop = 12 + Math.random() * (maxTop - 12);
            btnNao.style.transform = 'none';
            btnNao.style.left = newLeft + 'px';
            btnNao.style.top = newTop + 'px';
        }

        function checkProximityNao(clientX, clientY) {
            const btnRect = btnNao.getBoundingClientRect();
            const centerX = btnRect.left + btnRect.width / 2;
            const centerY = btnRect.top + btnRect.height / 2;
            const dist = Math.hypot(clientX - centerX, clientY - centerY);
            if (dist < 90) {
                moveBtnNao();
            }
        }

        proposalBox.addEventListener('mousemove', (e) => checkProximityNao(e.clientX, e.clientY));
        proposalBox.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            if (touch) checkProximityNao(touch.clientX, touch.clientY);
        }, { passive: true });

        btnNao.addEventListener('click', (e) => {
            e.preventDefault();
            moveBtnNao();
        });

        document.getElementById('btnSim').addEventListener('click', () => goToQuestion(1));

        // ---- Pergunta 1: calendário (dia) ----
        const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const weekdayNames = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        let calendarViewDate = new Date(today.getFullYear(), today.getMonth(), 1);
        let selectedDate = null;

        const calendarDaysEl = document.getElementById('calendarDays');
        const calendarMonthYearEl = document.getElementById('calendarMonthYear');
        const prevMonthBtn = document.getElementById('prevMonth');
        const nextMonthBtn = document.getElementById('nextMonth');

        function renderCalendar() {
            calendarDaysEl.innerHTML = '';
            const year = calendarViewDate.getFullYear();
            const month = calendarViewDate.getMonth();

            calendarMonthYearEl.textContent = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const empty = document.createElement('div');
                empty.className = 'cal-day empty';
                calendarDaysEl.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const cellDate = new Date(year, month, day);
                const cell = document.createElement('div');
                cell.className = 'cal-day';
                cell.textContent = day;

                if (cellDate < today) {
                    cell.classList.add('disabled');
                } else {
                    if (selectedDate && cellDate.getTime() === selectedDate.getTime()) {
                        cell.classList.add('selected');
                    }
                    cell.addEventListener('click', () => {
                        document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
                        cell.classList.add('selected');
                        selectedDate = cellDate;
                        document.getElementById('btnNext1').disabled = false;
                    });
                }

                calendarDaysEl.appendChild(cell);
            }

            prevMonthBtn.disabled = (year === today.getFullYear() && month === today.getMonth());
        }

        function formatSelectedDate(date) {
            const weekday = weekdayNames[date.getDay()];
            return `${weekday}, ${date.getDate()} de ${monthNames[date.getMonth()]} de ${date.getFullYear()}`;
        }

        prevMonthBtn.addEventListener('click', () => {
            calendarViewDate.setMonth(calendarViewDate.getMonth() - 1);
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();

        document.getElementById('btnNext1').addEventListener('click', () => goToQuestion(2));
        document.getElementById('btnPrev2').addEventListener('click', () => goToQuestion(1));

        // ---- Pergunta 2: horário ----
        const horaInput = document.getElementById('horaInput');
        horaInput.addEventListener('input', () => {
            document.getElementById('btnNext2').disabled = !horaInput.value;
        });

        // ---- Pergunta 3: lugar (muda conforme o horário escolhido) ----
        // Pesquisado perto da Paróquia Senhor Bom Jesus (igreja matriz), no Centro de Potirendaba - SP
        const lugaresDia = [
            'Largo Bom Jesus (praça da igreja)',
            'Sorveteria Mauá',
            'Palácio dos Sorvetes',
            'Karlla Lanches e Cremoso',
            'Outro lugar'
        ];

        const lugaresNoite = [
            'Largo Bom Jesus à noite',
            'Point Burger',
            'Villa Italiana (pizzaria)',
            'Sorveteria Pinguim',
            'Outro lugar'
        ];

        let selectedLugar = null;

        function renderLugarOptions(isNight) {
            const container = document.getElementById('lugarOptions');
            const lista = isNight ? lugaresNoite : lugaresDia;
            container.innerHTML = lista.map(nome => `
                <label class="option${nome === selectedLugar ? ' selected' : ''}">
                    <input type="radio" name="lugar" value="${nome}" style="display:none;" ${nome === selectedLugar ? 'checked' : ''}>
                    ${nome}
                </label>
            `).join('');
            document.getElementById('btnSubmit').disabled = !(selectedLugar && lista.includes(selectedLugar));
        }

        document.getElementById('lugarOptions').addEventListener('click', (e) => {
            const optionEl = e.target.closest('.option');
            if (!optionEl) return;
            const radio = optionEl.querySelector('input[type="radio"]');
            document.querySelectorAll('#lugarOptions .option').forEach(opt => opt.classList.remove('selected'));
            optionEl.classList.add('selected');
            radio.checked = true;
            selectedLugar = radio.value;
            document.getElementById('btnSubmit').disabled = false;
        });

        document.getElementById('btnNext2').addEventListener('click', () => {
            const hh = parseInt(horaInput.value.split(':')[0], 10);
            const isNight = (hh >= 18 || hh < 6);
            renderLugarOptions(isNight);
            goToQuestion(3);
        });

        document.getElementById('btnPrev3').addEventListener('click', () => goToQuestion(2));

        // Submit
        document.getElementById('btnSubmit').addEventListener('click', async () => {
            const dia = selectedDate ? formatSelectedDate(selectedDate) : '';
            const hora = horaInput.value;
            const lugarChecked = document.querySelector('input[name="lugar"]:checked');
            const lugar = lugarChecked ? lugarChecked.value : '';
            const sugestao = document.getElementById('sugestao').value;

            loading.classList.add('active');
            document.getElementById('question3').style.display = 'none';

            try {
                await emailjs.send('service_ism2qp3', 'ic1eele', {
                    dia: dia,
                    hora: hora,
                    lugar: lugar,
                    sugestao: sugestao || 'Nenhuma sugestão'
                });

                loading.classList.remove('active');
                successMessage.classList.add('active');
                progressBar.style.width = '100%';
            } catch (error) {
                console.error('Erro ao enviar email:', error);
                alert('Erro ao enviar. Tente novamente!');
                loading.classList.remove('active');
                document.getElementById('question3').style.display = 'block';
            }
        });

        // Inicializar progresso
        updateProgress();
    </script>
</body>
</html>
